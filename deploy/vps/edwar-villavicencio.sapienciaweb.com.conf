server {
    listen 80;
    server_name edwar-villavicencio.sapienciaweb.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name edwar-villavicencio.sapienciaweb.com;

    ssl_certificate /etc/letsencrypt/live/edwar-villavicencio.sapienciaweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edwar-villavicencio.sapienciaweb.com/privkey.pem;

    client_max_body_size 20M;

    # Entrega el HTML del perfil en la raiz, conservando el hostname visible.
    # La aplicacion reconoce este hostname y asocia `/` al componente de Edwar.
    location = / {
        proxy_pass http://sapiencia_web_vps:80/edwar-villavicencio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LinkedIn no ejecuta Angular: recibe estas etiquetas desde el HTML.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '<title>Sapiencia Web</title>' '<title>Edwar Villavicencio | Portafolio profesional</title>';
        sub_filter '<link rel="canonical" href="https://sapienciaweb.com">' '<link rel="canonical" href="https://edwar-villavicencio.sapienciaweb.com/">';
        sub_filter '</head>' '<meta property="og:locale" content="es_CO"><meta property="og:type" content="profile"><meta property="og:site_name" content="Edwar Villavicencio"><meta property="og:title" content="Edwar Villavicencio | Portafolio profesional"><meta property="og:description" content="Ingeniero de Sistemas, desarrollador Full Stack e ingeniero de IA/LLM. Conoce mi experiencia, proyectos y tecnologias."><meta property="og:url" content="https://edwar-villavicencio.sapienciaweb.com/"><meta property="og:image" content="https://edwar-villavicencio.sapienciaweb.com/assets/img/default/fundadores/foto-perfil-edwar-villavicencio.jpeg"><meta property="og:image:width" content="1103"><meta property="og:image:height" content="1455"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Edwar Villavicencio | Portafolio profesional"><meta name="twitter:description" content="Ingeniero de Sistemas, desarrollador Full Stack e ingeniero de IA/LLM."><meta name="twitter:image" content="https://edwar-villavicencio.sapienciaweb.com/assets/img/default/fundadores/foto-perfil-edwar-villavicencio.jpeg"></head>';
    }

    # JS, CSS, imagenes y demas recursos siguen saliendo del mismo contenedor.
    location / {
        proxy_pass http://sapiencia_web_vps:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
