<div #mapa class="mapa">
  <div class="barra">
    <div class="perfil">
      <h1 class="nombre">EDWAR VILLAVICENCIO</h1>
      <p class="titulo">Ingeniero de Sistemas | Desarrollador Full Stack | Ingeniero de IA/LLM</p>
    </div>

    <div class="ruta">
      <div
        *ngFor="let item of tabs"
        class="nodo"
        role="button"
        tabindex="0"
        [class.activo]="item === active"
        [attr.aria-pressed]="item === active"
        (click)="select(item)"
        (keydown.enter)="select(item)"
        (keydown.space)="select(item); $event.preventDefault()"
      >
        <p class="texto">{{ item }}</p>
        <span class="punto"></span>
      </div>
    </div>
  </div>
</div>

<div class="space" [style.height.px]="navHeight" aria-hidden="true"></div>
